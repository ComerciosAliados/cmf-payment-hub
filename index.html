<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hub de Pagos · Demo</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="demo-banner">DEMO con datos ficticios · No se procesan pagos reales</div>

  <!-- Login -->
  <section id="login" class="login hidden">
    <div class="card">
      <div class="brand"><div class="brand-mark">HP</div><div><h1 style="margin:0">Hub de Pagos</h1><div class="muted small">Cobros centralizados</div></div></div>
      <div class="field"><label for="lg-user">Usuario</label><input id="lg-user" placeholder="usuario@empresa.com" autocomplete="off"></div>
      <div class="field"><label for="lg-pass">Contraseña</label><input id="lg-pass" type="password" placeholder="••••••••"></div>
      <div class="field"><label class="check"><input type="checkbox" checked disabled> Verificación en dos pasos (2FA)</label></div>
      <p class="muted small" style="margin-top:0">En la demo no hay contraseñas: entra con uno de los perfiles para ver cómo cambian los permisos.</p>
      <div id="role-buttons"></div>
    </div>
  </section>

  <!-- App -->
  <div id="app" class="shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">HP</div><b>Hub de Pagos</b></div>
      <nav class="nav" id="nav"></nav>
      <div class="user" id="user-box"></div>
    </aside>
    <div>
      <div class="topbar"><button class="btn btn-sm" id="menu-btn" aria-label="Menú">☰</button><b>Hub de Pagos</b></div>
      <main class="main" id="view"></main>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
